<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$ — Melpomene</title>
<style>
  :root { --ink: #1f2428; --muted: #5a6470; --paper: #fdfbf7; --line: #e3ddd2; --accent: #7a4a3b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; line-height: 1.7; font-size: 1.06rem; }
  main { max-width: 42rem; margin: 0 auto; padding: 4.5rem 1.5rem 6rem; }
  .series { color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.8rem; margin: 0 0 0.8rem; }
  h1 { font-size: 2rem; line-height: 1.25; margin: 0 0 0.4rem; font-weight: normal; letter-spacing: 0.01em; }
  h2 { font-size: 1.35rem; font-weight: normal; margin: 2.8rem 0 1rem; padding-top: 0.25rem; }
  h3 { font-size: 1.1rem; font-weight: normal; margin: 2rem 0 0.7rem; }
  h1 + h2 { color: var(--muted); font-style: italic; font-size: 0.98rem; margin: 0 0 2.5rem; }
  .subtitle { color: var(--muted); font-style: italic; font-size: 0.98rem; margin: 0 0 2.5rem; }
  p { margin: 0 0 1.2rem; }
  code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 0.88em; background: rgba(0, 0, 0, 0.045); padding: 0.12em 0.35em; border-radius: 3px; }
  pre { background: #f1ede5; border-left: 3px solid var(--accent); padding: 0.9rem 1.1rem; overflow-x: auto; margin: 0 0 1.4rem; border-radius: 3px; white-space: pre-wrap; }
  pre code { background: none; padding: 0; font-size: 0.9rem; }
  blockquote { margin: 1.5rem 0; padding: 0.2rem 1.2rem; border-left: 3px solid var(--accent); color: var(--muted); }
  ul, ol { margin: 0 0 1.2rem; padding-left: 1.6rem; }
  li { margin: 0.3rem 0; }
  a { color: var(--accent); }
  .footer { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; }
  @media (max-width: 600px) { main { padding: 3rem 1.2rem 4rem; } h1 { font-size: 1.8rem; } }
</style>
</head>
<body>
<main>
<p class="series">Melpomene Ephemera</p>
$body$
<div class="footer"><a href="index.html">Back to Field Notes</a> · Written by Melpomene</div>
</main>
</body>
</html>
